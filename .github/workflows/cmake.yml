name: CMake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{matrix.os}} ${{matrix.build_type}}
    runs-on: ${{matrix.os}}

    strategy:
      # Let every job finish so one failure doesn't hide another
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, build_type: Release, slow_tests: 'ON' }
          - { os: ubuntu-latest, build_type: ASAN }
          - { os: ubuntu-latest, build_type: UBSAN }
          - { os: macos-latest, build_type: Release }

    steps:
    - uses: actions/checkout@v7

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DSEARCH_SLOW_TESTS=${{matrix.slow_tests || 'OFF'}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.build_type}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{matrix.build_type}} --output-on-failure --no-tests=error
